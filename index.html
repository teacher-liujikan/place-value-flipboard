<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>位值翻牌計數器</title>
<style>
  :root{
    --chalk-bg-1: #1f3b32;
    --chalk-bg-2: #16281f;
    --wood: #8a5a37;
    --wood-dark: #6b4327;
    --wood-light: #a9744a;
    --card-face: #f5efe0;
    --card-face-shade: #e7ddc4;
    --ink: #262218;
    --chalk-text: #f4efe3;
    --chalk-text-dim: #cfd8c9;
    --amber: #e8a93b;
    --amber-deep: #b4791f;
    --brick: #bd5333;
    --brick-deep: #8f3a22;
    --rivet: #d8cba6;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(ellipse at 50% -10%, #2c4c40 0%, var(--chalk-bg-1) 45%, var(--chalk-bg-2) 100%);
    color: var(--chalk-text);
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .stage{
    max-width: 880px;
    margin: 0 auto;
    padding: 40px 20px 56px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  header{
    text-align:center;
    max-width: 560px;
    margin-bottom: 30px;
  }

  h1{
    font-size: clamp(26px, 4vw, 34px);
    font-weight: 800;
    letter-spacing: 0.02em;
    margin: 0 0 10px;
    color: var(--chalk-text);
  }

  .subtitle{
    margin:0;
    font-size: 15px;
    line-height:1.7;
    color: var(--chalk-text-dim);
  }

  /* ---------- shelf ---------- */
  .counter-shelf{
    position: relative;
    display:flex;
    gap: 18px;
    padding: 30px 26px 22px;
    border-radius: 18px;
    background: linear-gradient(180deg, var(--wood-light) 0%, var(--wood) 55%, var(--wood-dark) 100%);
    box-shadow:
      0 22px 40px rgba(0,0,0,0.35),
      inset 0 2px 0 rgba(255,255,255,0.18),
      inset 0 -6px 12px rgba(0,0,0,0.25);
    flex-wrap: wrap;
    justify-content: center;
  }

  .column{
    display:flex;
    flex-direction: column;
    align-items:center;
    width: 128px;
    position:relative;
  }

  .place-label{
    font-size: 17px;
    font-weight: 700;
    color: var(--chalk-text);
    background: rgba(0,0,0,0.22);
    padding: 3px 14px;
    border-radius: 999px;
    margin-bottom: 12px;
    letter-spacing: 0.05em;
  }

  .place-value{
    margin-top: 8px;
    font-size: 12px;
    color: rgba(255,255,255,0.65);
    letter-spacing: 0.03em;
  }

  /* ---------- flip card ---------- */
  .card-flip{
    width: 104px;
    height: 138px;
    perspective: 480px;
    position: relative;
  }

  .card-flip::before,
  .card-flip::after{
    content:"";
    position:absolute;
    top: 50%;
    width: 9px;
    height: 9px;
    margin-top: -4.5px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--rivet), #8a7c53 70%);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);
    z-index: 6;
  }
  .card-flip::before{ left: -5px; }
  .card-flip::after{ right: -5px; }

  .card-inner{
    position:relative;
    width:100%;
    height:100%;
    transform-style: preserve-3d;
    transition: transform 0.9s cubic-bezier(.45,.05,.35,1);
  }
  .card-inner.flip{
    transform: rotateX(-180deg);
  }
  .card-inner.notransition{
    transition: none !important;
  }
  .card-inner.shake{
    animation: shake 0.4s;
  }
  @keyframes shake{
    0%,100%{ transform: translateX(0); }
    20%{ transform: translateX(-6px); }
    40%{ transform: translateX(5px); }
    60%{ transform: translateX(-4px); }
    80%{ transform: translateX(3px); }
  }

  .card-face{
    position:absolute;
    inset:0;
    backface-visibility: hidden;
    border-radius: 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 62px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    background: linear-gradient(180deg, var(--card-face) 0%, var(--card-face-shade) 100%);
    box-shadow:
      0 8px 18px rgba(0,0,0,0.30),
      inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .card-face.back{
    transform: rotateX(180deg);
  }
  .card-face::after{
    content:"";
    position:absolute;
    left:0; right:0; top:50%;
    height: 3px;
    margin-top:-1.5px;
    background: rgba(0,0,0,0.18);
    box-shadow: 0 1px 2px rgba(0,0,0,0.15);
  }

  /* ---------- buttons ---------- */
  .btn-row{
    display:flex;
    gap: 10px;
    margin-top: 14px;
  }

  .btn{
    width: 46px;
    height: 40px;
    border-radius: 10px;
    border: none;
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
    color: var(--ink);
    background: linear-gradient(180deg, #fff 0%, #e9e2cd 100%);
    box-shadow: 0 4px 0 rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.7);
    transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
  }
  .btn:active{
    transform: translateY(3px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.7);
  }
  .btn.plus:hover{ background: linear-gradient(180deg, #fff 0%, #f4e2bd 100%); }
  .btn.minus:hover{ background: linear-gradient(180deg, #fff 0%, #f2d3c6 100%); }
  .btn:focus-visible{
    outline: 3px solid var(--amber);
    outline-offset: 2px;
  }

  /* ---------- floating carry/borrow badge ---------- */
  .float-badge{
    position: fixed;
    top:0; left:0;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 800;
    color: #fff;
    pointer-events:none;
    z-index: 50;
    box-shadow: 0 6px 14px rgba(0,0,0,0.35);
    transition: transform 0.9s cubic-bezier(.35,.05,.25,1), opacity 0.9s ease;
    opacity: 0;
  }
  .float-badge.carry{ background: linear-gradient(180deg, var(--amber), var(--amber-deep)); }
  .float-badge.borrow{ background: linear-gradient(180deg, var(--brick), var(--brick-deep)); }

  /* ---------- banner ---------- */
  .banner{
    margin-top: 22px;
    max-width: 560px;
    width: 100%;
    text-align:center;
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 14.5px;
    line-height: 1.8;
    font-weight: 600;
    color: #2b2413;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .banner[hidden]{ display:none; }
  .banner.carry{
    background: linear-gradient(180deg, #f6cf7c, var(--amber));
    box-shadow: 0 6px 16px rgba(180,121,31,0.35);
  }
  .banner.borrow{
    background: linear-gradient(180deg, #e5967d, var(--brick));
    color: #2b1710;
    box-shadow: 0 6px 16px rgba(143,58,34,0.35);
  }
  .banner.warn{
    background: linear-gradient(180deg, #d8d2c0, #b7ae94);
    color: #2b2413;
  }

  /* ---------- summary ---------- */
  .summary{
    margin-top: 28px;
    text-align:center;
  }
  .total{
    font-size: 20px;
    font-weight: 700;
    color: var(--chalk-text);
  }
  .total span{
    font-size: 30px;
    font-weight: 800;
    color: var(--amber);
    font-variant-numeric: tabular-nums;
    margin-left: 6px;
  }
  .expanded{
    margin-top: 8px;
    font-size: 15px;
    color: var(--chalk-text-dim);
    font-variant-numeric: tabular-nums;
  }

  .reset-btn{
    margin-top: 26px;
    padding: 10px 26px;
    border-radius: 999px;
    border: 1.5px solid rgba(244,239,227,0.5);
    background: transparent;
    color: var(--chalk-text);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.08s ease;
  }
  .reset-btn:hover{ background: rgba(244,239,227,0.12); }
  .reset-btn:active{ transform: translateY(2px); }
  .reset-btn:focus-visible{
    outline: 3px solid var(--amber);
    outline-offset: 2px;
  }

  @media (max-width: 560px){
    .counter-shelf{ gap: 10px; padding: 22px 14px 16px; }
    .column{ width: 78px; }
    .card-flip{ width: 68px; height: 92px; }
    .card-face{ font-size: 40px; border-radius: 9px; }
    .place-label{ font-size: 13px; padding: 2px 9px; }
    .place-value{ font-size: 10px; }
    .btn{ width: 36px; height: 34px; font-size: 16px; }
    .total span{ font-size: 24px; }
  }

  @media (prefers-reduced-motion: reduce){
    .card-inner{ transition: none; }
    .float-badge{ transition: none; }
  }
</style>
</head>
<body>

<div class="stage">
  <header>
    <h1>位值翻牌計數器</h1>
    <p class="subtitle">按每一位下方的「＋ / −」讓數字翻牌。滿十會自動向左邊進位，不夠減會向左邊借位，一次就能看懂進退位怎麼發生的。</p>
  </header>

  <div class="counter-shelf" id="shelf">
    <!-- columns injected by JS -->
  </div>

  <div class="banner" id="banner" hidden></div>

  <div class="summary">
    <div class="total">目前總數：<span id="totalNum">0</span></div>
    <div class="expanded" id="expandedForm"></div>
  </div>

  <button class="reset-btn" id="resetBtn">重設歸零</button>
</div>

<script>
(function(){
  const PLACES = [
    { label: "千位", mult: "×1000", pow: 1000 },
    { label: "百位", mult: "×100",  pow: 100  },
    { label: "十位", mult: "×10",   pow: 10   },
    { label: "個位", mult: "×1",    pow: 1    },
  ];

  let digits = [0,0,0,0];

  const shelf = document.getElementById("shelf");
  const banner = document.getElementById("banner");
  const totalNumEl = document.getElementById("totalNum");
  const expandedEl = document.getElementById("expandedForm");

  // build columns
  const cards = []; // {inner, front, back}
  PLACES.forEach((p, i) => {
    const col = document.createElement("div");
    col.className = "column";
    col.innerHTML = `
      <div class="place-label">${p.label}</div>
      <div class="card-flip">
        <div class="card-inner">
          <div class="card-face front">0</div>
          <div class="card-face back">0</div>
        </div>
      </div>
      <div class="place-value">${p.mult}</div>
      <div class="btn-row">
        <button class="btn minus" aria-label="${p.label}減1" data-i="${i}" data-d="-1">−</button>
        <button class="btn plus" aria-label="${p.label}加1" data-i="${i}" data-d="1">＋</button>
      </div>
    `;
    shelf.appendChild(col);

    const inner = col.querySelector(".card-inner");
    const front = col.querySelector(".card-face.front");
    const back  = col.querySelector(".card-face.back");
    cards.push({ inner, front, back, colEl: col });

    col.querySelectorAll(".btn").forEach(btn=>{
      btn.addEventListener("click", () => {
        const idx = parseInt(btn.dataset.i, 10);
        const delta = parseInt(btn.dataset.d, 10);
        changeDigit(idx, delta);
      });
    });
  });

  document.getElementById("resetBtn").addEventListener("click", () => {
    digits = [0,0,0,0];
    cards.forEach(c => { c.front.textContent = "0"; c.back.textContent = "0"; c.inner.classList.remove("flip"); });
    hideBanner();
    updateSummary();
  });

  function totalValue(){
    return digits[0]*1000 + digits[1]*100 + digits[2]*10 + digits[3];
  }

  function updateSummary(){
    const total = totalValue();
    totalNumEl.textContent = total;
    const parts = [];
    if (digits[0] > 0) parts.push(digits[0]*1000);
    if (digits[1] > 0) parts.push(digits[1]*100);
    if (digits[2] > 0) parts.push(digits[2]*10);
    if (digits[3] > 0 || parts.length === 0) parts.push(digits[3]);
    expandedEl.textContent = parts.length > 1
      ? `展開式：${parts.join(" + ")} = ${total}`
      : `展開式：${total}`;
  }

  function flipCard(i, newValue, delay){
    setTimeout(() => {
      const c = cards[i];
      c.back.textContent = String(newValue);
      c.inner.classList.add("flip");
      setTimeout(() => {
        c.inner.classList.add("notransition");
        c.inner.classList.remove("flip");
        c.front.textContent = String(newValue);
        void c.inner.offsetHeight; // force reflow so the reset applies instantly
        c.inner.classList.remove("notransition");
      }, 900);
    }, delay);
  }

  function shakeCard(i){
    const c = cards[i];
    c.inner.classList.add("shake");
    setTimeout(()=> c.inner.classList.remove("shake"), 420);
  }

  function showBanner(text, type){
    banner.textContent = text;
    banner.className = "banner " + type;
    banner.hidden = false;
  }
  function hideBanner(){
    banner.hidden = true;
  }

  function spawnFloatBadge(fromIdx, toIdx, type, delay){
    setTimeout(() => {
      const fromRect = cards[fromIdx].colEl.getBoundingClientRect();
      const toRect = cards[toIdx].colEl.getBoundingClientRect();
      const badge = document.createElement("div");
      badge.className = "float-badge " + type;
      badge.textContent = type === "carry" ? "+1" : "−1";
      document.body.appendChild(badge);

      const startX = fromRect.left + fromRect.width/2 - 18;
      const startY = fromRect.top + 6;
      badge.style.transform = `translate(${startX}px, ${startY}px)`;
      badge.style.opacity = "0";

      requestAnimationFrame(() => {
        badge.style.opacity = "1";
        requestAnimationFrame(() => {
          const endX = toRect.left + toRect.width/2 - 18;
          const endY = toRect.top + 6;
          badge.style.transform = `translate(${endX}px, ${endY}px)`;
        });
      });

      setTimeout(() => {
        badge.style.opacity = "0";
        setTimeout(()=> badge.remove(), 400);
      }, 800);
    }, delay);
  }

  function changeDigit(startIdx, delta){
    const temp = digits.slice();
    const chain = [];
    let i = startIdx;
    let blocked = false;

    while(true){
      const nd = temp[i] + delta;
      if (nd > 9){
        if (i === 0){ blocked = true; break; }
        temp[i] = 0;
        chain.push(i);
        i -= 1;
        continue;
      } else if (nd < 0){
        if (i === 0){ blocked = true; break; }
        temp[i] = 9;
        chain.push(i);
        i -= 1;
        continue;
      } else {
        temp[i] = nd;
        chain.push(i);
        break;
      }
    }

    if (blocked){
      shakeCard(startIdx);
      showBanner(
        delta > 0 ? "已經是最大值 9999，沒辦法再往上進位囉！" : "已經是 0，沒辦法再往下借位囉！",
        "warn"
      );
      return;
    }

    digits = temp;

    // animate flips in sequence, each ~260ms apart, cascading
    const STEP = 550;
    chain.forEach((colIdx, order) => {
      flipCard(colIdx, digits[colIdx], order * STEP);
    });

    // banner + floating badges for carry/borrow steps
    if (chain.length > 1){
      const type = delta > 0 ? "carry" : "borrow";
      const lines = [];
      for (let k = 0; k < chain.length - 1; k++){
        const src = chain[k];
        const dst = chain[k+1];
        spawnFloatBadge(src, dst, type, k * STEP + 200);
        if (delta > 0){
          lines.push(`${PLACES[src].label}滿10，向${PLACES[dst].label}進1`);
        } else {
          lines.push(`${PLACES[src].label}不夠減，向${PLACES[dst].label}借1，變成10`);
        }
      }
      showBanner(lines.join("；") + "！", type);
    } else {
      hideBanner();
    }

    setTimeout(updateSummary, chain.length * STEP + 200);
  }

  updateSummary();
})();
</script>

</body>
</html>
